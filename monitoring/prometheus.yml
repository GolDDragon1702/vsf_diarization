# Prometheus scrape config cho VSF Diarization API.
# Chạy: docker compose -f monitoring/docker-compose.yml up
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: vsf-diarization
    metrics_path: /metrics/prometheus
    static_configs:
      # host.docker.internal = máy host (nơi chạy `vsf-serve`). Đổi nếu API chạy nơi khác.
      - targets: ["host.docker.internal:8000"]
