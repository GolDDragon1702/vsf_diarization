# Prometheus scrape config cho VSF Diarization API.
# Dùng trong full-stack compose: scrape service "app" qua mạng nội bộ compose.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: vsf-diarization
    metrics_path: /metrics/prometheus
    static_configs:
      # "app" = tên service trong docker-compose. Nếu API chạy trên host (ngoài
      # compose), đổi thành ["host.docker.internal:8000"].
      - targets: ["app:8000"]
