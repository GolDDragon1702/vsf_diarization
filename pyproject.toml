[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsf-diarization"
version = "0.1.0"
description = "Vietnamese speech diarization + ASR (pyannote + Whisper/Qwen), offline & streaming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GolDDragon1702" }]
keywords = ["speech", "diarization", "asr", "vietnamese", "pyannote", "whisper", "streaming"]

# torch / torchaudio cài riêng theo CUDA (xem README), nên không pin ở đây
# để tránh ghi đè bản cu128 bằng bản CPU.
dependencies = [
    "pyannote.audio>=3.1.0",
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pyannote.metrics",
    "jiwer",
    "librosa>=0.10",
]

[project.optional-dependencies]
qwen = ["qwen-asr"]            # ASR Qwen3 (pip install -e ".[qwen]")
serve = [                     # REST/WebSocket API + web UI + observability (pip install -e ".[serve]")
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "gradio>=4.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "prometheus-client>=0.20",
]
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.8"]   # test + lint + type

[project.urls]
Repository = "https://github.com/GolDDragon1702/vsf_diarization"

[project.scripts]
vsf-diarize        = "vsf_diarization.pipelines.pipeline:main"
vsf-stream         = "vsf_diarization.pipelines.pipeline_streaming:main"
vsf-evaluate       = "vsf_diarization.eval.evaluate:main"
vsf-eval-streaming = "vsf_diarization.eval.eval_streaming:main"
vsf-create-gt      = "vsf_diarization.create_ground_truth:main"
vsf-serve          = "vsf_diarization.serve.api:main"

[tool.setuptools.packages.find]
include = ["vsf_diarization*"]

[tool.setuptools.package-data]
"vsf_diarization.serve" = ["static/*"]   # frontend (html/css/js) đi kèm package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# E402: nhiều script cố ý reconfigure stdout TRƯỚC import (encoding utf-8 cho tiếng Việt).
# E702/E731: code dùng style ngắn gọn (semicolon, lambda) nhất quán toàn dự án.
lint.ignore = ["E402", "E702", "E731"]

[tool.mypy]
# Type-check tăng dần: chỉ các module mới (đã type). Module ML cũ (pyannote/whisper
# nặng, untyped) để sau — follow_imports=silent bỏ qua lỗi của chúng.
files = ["vsf_diarization/serve", "vsf_diarization/core/streaming_session.py"]
ignore_missing_imports = true
follow_imports = "silent"
