name: CI

on:
  push:
    branches: [main, public-main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Chỉ cài dependency đủ để chạy test thuần (không pyannote/whisper/GPU).
      # torch CPU để import core.streaming_session; fastapi/httpx cho test API.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy python-dotenv pytest httpx fastapi

      - name: Run tests
        run: pytest -q
